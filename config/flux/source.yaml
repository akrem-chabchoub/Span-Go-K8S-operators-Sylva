apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: span
  namespace: flux-system
spec:
  interval: 30s
  url: http://host.docker.internal:8088/span.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: span
  namespace: flux-system
spec:
  interval: 30s
  prune: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: span
  path: ./
