[package]
name = "span-helper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "span-helper"
path = "src/main.rs"

[dependencies]
futures = "0.3"
netlink-packet-core = "0.7"
netlink-packet-route = "0.33"
nix = { version = "0.29", features = ["sched"] }
rtnetlink = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
